name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Focused authorization, catalog and route tests
        # PGlite integration explicitly skips without NARI_TEST_PGLITE_PATH; cloud acceptance is separate.
        run: node --test test/access-policy.test.mjs test/auth-boundary.test.mjs test/order-boundary.test.mjs test/supabase-principal.test.mjs test/supabase-session.test.mjs test/postgres-foundation.test.cjs test/catalog-admin.test.cjs test/campaign-routing.test.cjs test/catalog-security.test.cjs test/staff-portal.test.cjs test/catalog-storefront.test.cjs test/catalog-api-postgres.test.cjs test/supabase-live-helper.test.mjs test/ops-cli.test.mjs

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
